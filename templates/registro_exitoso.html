<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro exitoso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:450px;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
            text-align:center;
            padding:40px;
        }

        .check{
            font-size:70px;
            color:#28a745;
        }

    </style>

</head>
<body>

<div class="card">

    <div class="check">
        ✔
    </div>

    <h2 class="mt-3 text-success">
        ¡Registro exitoso!
    </h2>

    <p class="text-muted mt-3">
        Tu cuenta ha sido creada correctamente.
    </p>

    <a href="/login" class="btn btn-success btn-lg mt-4">
        Iniciar sesión
    </a>

</div>

</body>
</html>
